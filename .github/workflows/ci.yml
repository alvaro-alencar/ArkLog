name: ArkLog CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend security and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate Python
        run: |
          python -m compileall -q app api tests
          ruff check --select E9,F app api tests
          ruff check app/security app/api/v1/routes/access.py tests/test_secure_access_policy.py
      - name: Test backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./data/arklog-ci.db
          ARKLOG_AUTO_TRIAL: "false"
          SCHEDULER_ENABLED: "false"
        run: pytest -q

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard
        run: npm ci
      - name: Build dashboard
        run: npm run build
