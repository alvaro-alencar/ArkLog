display_information:
  name: ArkLog
  description: Lê canais autorizados como fonte e publica relatórios como destino.
  background_color: "#6d28d9"
features:
  bot_user:
    display_name: ArkLog
    always_online: false
oauth_config:
  redirect_urls:
    - https://www.arksystem.net/api/arklog/v1/connections/slack/callback
  scopes:
    bot:
      - channels:read
      - groups:read
      - channels:history
      - groups:history
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
