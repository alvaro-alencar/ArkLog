name: Apply secure ArkLog patch

on:
  push:
    branches:
      - feat/arklog-secure-access

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-secure-patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/arklog-secure-access

      - name: Validate and extract patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/arklog-secure-patch/part-* | base64 --decode > /tmp/arklog-secure-patch.tar.gz
          echo "6fb441671b4dd660cfa035d95499ca381cc904bcbd8ce662101d334c48a30173  /tmp/arklog-secure-patch.tar.gz" | sha256sum -c -
          tar -xzf /tmp/arklog-secure-patch.tar.gz
          rm -rf .ci/arklog-secure-patch
          rm -f .github/workflows/apply-secure-arklog-patch.yml

      - name: Commit applied patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ArkSystem Automation"
          git config user.email "actions@arksystem.net"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Secure ArkLog access and report quotas"
          git push origin HEAD:feat/arklog-secure-access
