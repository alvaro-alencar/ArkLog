name: Apply ArkLog CI fixes

on:
  push:
    branches:
      - feat/arklog-secure-access

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[ci-autofix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arklog-secure-access
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply focused fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('dashboard/src/views/NewProject.tsx')
          text = path.read_text()
          old = 'const ClickUpIcon = ({ size = 20 }: { size?: number }) => (\n  <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor">'
          new = 'const ClickUpIcon = ({ size = 20, className = "" }: { size?: number; className?: string }) => (\n  <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className}>'
          if old not in text:
              raise SystemExit('ClickUpIcon target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m pip install --quiet ruff==0.16.0
          ruff check --fix app/security/access.py
          rm -f .github/workflows/ci-autofix.yml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "ArkSystem Automation"
          git config user.email "actions@arksystem.net"
          git add -A
          git commit -m "Fix ArkLog CI validation"
          git push origin HEAD:feat/arklog-secure-access
